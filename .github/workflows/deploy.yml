name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (inject backend URL + Google OAuth client ID from repo secrets)
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js gifenc.browser.js _site/
          cp -r icons _site/icons
          printf 'window.WEB_APP_URL = "%s";\nwindow.GOOGLE_CLIENT_ID = "%s";\n' "$WEB_APP_URL" "$GOOGLE_CLIENT_ID" > _site/config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
