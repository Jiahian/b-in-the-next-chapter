<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1066" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="turf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="50%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1e4620" />
    </linearGradient>
    <linearGradient id="stadiumLights" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="blockPartyBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="1066" fill="url(#nightSky)" />

  <!-- Stadium Lighting Flares -->
  <circle cx="280" cy="80" r="30" fill="#fff" opacity="0.9" />
  <circle cx="360" cy="85" r="28" fill="#fff" opacity="0.9" />
  <circle cx="680" cy="130" r="25" fill="#fff" opacity="0.8" />
  <polygon points="200,60 450,60 650,450 0,450" fill="url(#stadiumLights)" opacity="0.25" />

  <!-- Stadium Architecture & Windows -->
  <rect x="80" y="140" width="640" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Glass Window Panes -->
  <g fill="#38bdf8" opacity="0.25">
    <rect x="100" y="160" width="80" height="40" rx="3" />
    <rect x="200" y="160" width="80" height="40" rx="3" />
    <rect x="300" y="160" width="80" height="40" rx="3" />
    <rect x="400" y="160" width="80" height="40" rx="3" />
    <rect x="500" y="160" width="80" height="40" rx="3" />
    <rect x="600" y="160" width="80" height="40" rx="3" />
    <rect x="100" y="220" width="80" height="40" rx="3" />
    <rect x="200" y="220" width="80" height="40" rx="3" />
    <rect x="300" y="220" width="80" height="40" rx="3" />
    <rect x="400" y="220" width="80" height="40" rx="3" />
    <rect x="500" y="220" width="80" height="40" rx="3" />
    <rect x="600" y="220" width="80" height="40" rx="3" />
  </g>

  <!-- Giant LED Screen: BLOCK PARTY 2026 -->
  <rect x="440" y="70" width="160" height="90" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" filter="url(#glow)" />
  <rect x="446" y="76" width="148" height="78" rx="6" fill="url(#blockPartyBanner)" />
  <text x="520" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">BLOCK</text>
  <text x="520" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#fef08a" text-anchor="middle" letter-spacing="2">PARTY</text>
  <text x="520" y="148" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">2026</text>

  <!-- Lower LED Ribbon -->
  <rect x="340" y="235" width="240" height="30" rx="4" fill="url(#blockPartyBanner)" filter="url(#glow)" />
  <text x="460" y="256" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">BLOCK PARTY 2026</text>

  <!-- Sports Turf Green Field -->
  <path d="M0 320 Q 400 300 800 320 L 800 1066 L 0 1066 Z" fill="url(#turf)" />
  <!-- Field Markings -->
  <path d="M-50 780 Q 150 740 300 770" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" fill="none" />
  <path d="M0 880 L 160 880" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" fill="none" />

  <!-- Background Crowd Silhouette -->
  <g fill="#064e3b" opacity="0.5">
    <circle cx="200" cy="310" r="14" /><circle cx="225" cy="312" r="12" /><circle cx="245" cy="308" r="15" />
    <circle cx="580" cy="315" r="13" /><circle cx="610" cy="310" r="15" /><circle cx="640" cy="312" r="12" /><circle cx="680" cy="318" r="14" />
  </g>

  <!-- Cheerful Friends Group Silhouette & Illustration -->
  <!-- Back Row Friends -->
  <g id="backRow">
    <!-- Person 1 -->
    <circle cx="360" cy="330" r="32" fill="#fed7aa" stroke="#0f172a" stroke-width="2" />
    <path d="M328 320 Q360 290 392 320 Z" fill="#1e293b" />
    <rect x="320" y="360" width="80" height="90" rx="16" fill="#1e3a8a" />
    <!-- Peace Sign Hand -->
    <path d="M310 300 L320 270 M320 300 L335 275" stroke="#fed7aa" stroke-width="7" stroke-linecap="round" />

    <!-- Person 2 -->
    <circle cx="430" cy="335" r="30" fill="#fde047" opacity="0.9" stroke="#0f172a" stroke-width="2" />
    <path d="M400 325 Q430 295 460 325 Z" fill="#334155" />
    <rect x="395" y="362" width="70" height="85" rx="14" fill="#047857" />

    <!-- Person 3 (Right) -->
    <circle cx="530" cy="345" r="30" fill="#fed7aa" stroke="#0f172a" stroke-width="2" />
    <path d="M500 335 Q530 305 560 335 Z" fill="#18181b" />
    <rect x="490" y="370" width="76" height="80" rx="14" fill="#374151" />

    <!-- Person 4 (Glasses) -->
    <circle cx="660" cy="340" r="32" fill="#fed7aa" stroke="#0f172a" stroke-width="2" />
    <path d="M630 330 Q660 300 690 330 Z" fill="#0f172a" />
    <rect x="625" y="368" width="75" height="90" rx="16" fill="#991b1b" />
    <!-- Glasses -->
    <circle cx="650" cy="340" r="8" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="670" cy="340" r="8" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <line x1="658" y1="340" x2="662" y2="340" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Middle Row Friends -->
  <g id="middleRow">
    <!-- Left Girl (Striped Shirt) -->
    <circle cx="155" cy="405" r="36" fill="#fbcfe8" stroke="#0f172a" stroke-width="2" />
    <path d="M120 400 Q155 355 190 400 Z" fill="#78350f" />
    <rect x="110" y="440" width="90" height="120" rx="18" fill="#1e3a8a" />
    <!-- Stripes -->
    <line x1="110" y1="465" x2="200" y2="465" stroke="#ffffff" stroke-width="4" />
    <line x1="110" y1="490" x2="200" y2="490" stroke="#ffffff" stroke-width="4" />
    <line x1="110" y1="515" x2="200" y2="515" stroke="#ffffff" stroke-width="4" />

    <!-- Center Girl (Black Shirt) -->
    <circle cx="455" cy="390" r="38" fill="#fed7aa" stroke="#0f172a" stroke-width="2" />
    <path d="M415 380 Q455 330 495 380 Z" fill="#09090b" />
    <!-- Happy Smile -->
    <path d="M442 400 Q455 415 468 400" stroke="#09090b" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="445" cy="385" r="3.5" fill="#09090b" /><circle cx="465" cy="385" r="3.5" fill="#09090b" />
    <rect x="395" y="425" width="120" height="130" rx="20" fill="#18181b" />

    <!-- Right Guy (Grey Nike shirt) -->
    <circle cx="585" cy="445" r="38" fill="#fed7aa" stroke="#0f172a" stroke-width="2" />
    <path d="M550 435 Q585 390 620 435 Z" fill="#1e293b" />
    <circle cx="575" cy="440" r="7" fill="none" stroke="#0f172a" stroke-width="2" />
    <circle cx="595" cy="440" r="7" fill="none" stroke="#0f172a" stroke-width="2" />
    <rect x="525" y="480" width="120" height="120" rx="18" fill="#64748b" />

    <!-- Rightmost Girl (Graphic Tee & Peace Sign) -->
    <circle cx="715" cy="440" r="38" fill="#fed7aa" stroke="#0f172a" stroke-width="2" />
    <path d="M675 430 Q715 380 755 430 Z" fill="#18181b" />
    <circle cx="705" cy="435" r="7" fill="none" stroke="#0f172a" stroke-width="2" />
    <circle cx="725" cy="435" r="7" fill="none" stroke="#0f172a" stroke-width="2" />
    <path d="M705 450 Q715 462 725 450" stroke="#09090b" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <rect x="655" y="475" width="120" height="130" rx="20" fill="#18181b" />
    <!-- Peace Sign -->
    <path d="M780 470 L795 425 M790 465 L810 430" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Foreground Selfie Leader (Centered Big Smile) -->
  <g id="foregroundLeader">
    <!-- Hair -->
    <ellipse cx="480" cy="620" rx="150" ry="160" fill="#09090b" />
    <!-- Face -->
    <path d="M370 590 Q480 500 590 590 Q600 720 480 780 Q360 720 370 590 Z" fill="#fed7aa" stroke="#0f172a" stroke-width="3" />
    <!-- Cheerful Eyes -->
    <path d="M420 625 Q435 615 450 625" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="435" cy="628" r="5" fill="#0f172a" />
    <path d="M510 625 Q525 615 540 625" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="525" cy="628" r="5" fill="#0f172a" />
    <!-- Big Radiant Smile with Teeth -->
    <path d="M430 680 Q480 750 530 680 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <path d="M435 680 Q480 690 525 680" stroke="#e2e8f0" stroke-width="3" />
    <path d="M430 680 Q480 760 530 680" stroke="#991b1b" stroke-width="3" fill="none" />
    <!-- Black Athletic Shirt & Nike Swoosh -->
    <path d="M260 780 Q480 740 700 780 L760 1066 L200 1066 Z" fill="#09090b" />
    <path d="M550 880 Q565 890 580 870 Q560 880 550 880 Z" fill="#ffffff" />
  </g>

  <!-- Bottom Gradient Vignette for Gallery Contrast -->
  <rect y="920" width="800" height="146" fill="url(#nightSky)" opacity="0.4" />
</svg>
